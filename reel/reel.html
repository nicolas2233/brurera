<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dubrera Reel</title>
<style>
@font-face{font-family:Anton;src:url(assets/fonts/Anton.ttf)}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-Bold.ttf);font-weight:700}
@font-face{font-family:Caveat;src:url(assets/fonts/Caveat-Bold.ttf);font-weight:700}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-ExtraBold.ttf);font-weight:800}

:root{
  --green:#3b473c; --green2:#4f5f4f; --cream:#f7ecd3; --cream2:#efdfbb;
  --gold:#d9a441; --gold2:#c8b27a; --ink:#2f382f; --terra:#c8643b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Poppins,sans-serif;color:var(--ink)}

/* every animation is seeked from JS; delays are absolute: scene start + local delay */
.a{animation-fill-mode:both!important;animation-delay:calc(var(--s,0s) + var(--d,0s))!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)}

/* ---------- background pattern ---------- */
#pattern{position:absolute;inset:-200px;display:grid;grid-template-columns:repeat(6,240px);grid-auto-rows:240px;opacity:.13;
  animation:drift 30s linear infinite both}
#pattern img{width:120px;height:120px;margin:60px;filter:grayscale(1) sepia(.6)}
#pattern img:nth-child(2n){transform:rotate(-25deg)}
#pattern img:nth-child(3n){transform:rotate(30deg) scale(.8)}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-240px,-480px)}}

.scene{position:absolute;inset:0;visibility:hidden}
.full{position:absolute;inset:0}
.center{position:absolute;left:0;right:0;text-align:center}

/* ---------- keyframes ---------- */
@keyframes popIn{0%{transform:scale(0) rotate(-25deg);opacity:0}55%{transform:scale(1.15) rotate(6deg);opacity:1}78%{transform:scale(.94) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes slam{0%{transform:scale(3.2);opacity:0}55%{transform:scale(.92);opacity:1}75%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes slideUp{0%{transform:translateY(90px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideL{0%{transform:translateX(-1100px) rotate(-8deg)}70%{transform:translateX(30px) rotate(1deg)}100%{transform:none}}
@keyframes slideR{0%{transform:translateX(1100px) rotate(8deg)}70%{transform:translateX(-30px) rotate(-1deg)}100%{transform:none}}
@keyframes stamp{0%{transform:scale(2.6) rotate(-40deg);opacity:0}60%{transform:scale(.88) rotate(-8deg);opacity:1}80%{transform:scale(1.06) rotate(-13deg)}100%{transform:scale(1) rotate(-12deg)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes floaty{0%,100%{transform:translateY(-14px)}50%{transform:translateY(14px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-22px,10px) rotate(-2deg)}30%{transform:translate(18px,-12px) rotate(2deg)}45%{transform:translate(-14px,6px)}60%{transform:translate(10px,-6px)}75%{transform:translate(-5px,3px)}}
@keyframes fall{from{transform:translateY(-300px) rotate(0)}to{transform:translateY(2300px) rotate(540deg)}}
@keyframes orbit{from{transform:rotate(0) translateX(330px) rotate(0)}to{transform:rotate(360deg) translateX(330px) rotate(-360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-700px) rotate(25deg)}100%{transform:translateX(700px) rotate(25deg)}}
@keyframes wipe{from{transform:translateY(1920px)}to{transform:translateY(-3200px)}}
@keyframes blob{0%,100%{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}50%{border-radius:60% 40% 38% 62%/58% 55% 45% 42%}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- hook ---------- */
#hook{background:var(--green)}
#hook .rays{position:absolute;left:50%;top:46%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite both}
.faller{position:absolute;top:0;width:150px;animation:fall 2.4s linear both}
.big-alert{font-family:Anton;color:#f4c95d;font-size:300px;line-height:.95;letter-spacing:4px;text-shadow:0 12px 0 #232b23}
.big-antojo{font-family:Anton;color:var(--cream);font-size:210px;line-height:1;text-shadow:0 10px 0 #232b23}
.hand{font-family:Caveat;font-weight:700}

/* ---------- logo ---------- */
.logo{position:absolute;filter:drop-shadow(0 30px 40px rgba(40,50,40,.35))}
.logo-mask{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.logo-mask i{position:absolute;top:-200px;left:50%;width:140px;height:1200px;margin-left:-70px;
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.55),transparent)}
.ribbon{display:inline-block;background:var(--green);color:var(--cream);font-family:Anton;font-size:96px;padding:18px 60px 22px;letter-spacing:3px;
  transform:rotate(-3deg);box-shadow:0 14px 0 #263026}
.spark{position:absolute;width:110px}

/* ---------- product ---------- */
.blobbg{position:absolute;left:90px;top:330px;width:900px;height:900px;animation:blob 6s ease-in-out infinite both}
.plate{position:absolute;left:190px;top:430px;width:700px;height:700px;border-radius:50%;background:#fffaf0;
  box-shadow:0 30px 0 rgba(0,0,0,.08), inset 0 0 0 18px #fff, inset 0 0 0 22px var(--gold2)}
.hero{position:absolute;left:290px;top:520px;width:500px;height:500px}
.hero img{width:100%;height:100%}
.orb{position:absolute;left:470px;top:700px;width:140px;height:140px}
.orb img{width:140px}
.tag{position:absolute;top:240px;left:0;right:0;text-align:center}
.tag span{display:inline-block;background:var(--green);color:var(--cream);font-weight:800;font-size:44px;padding:14px 38px;border-radius:60px;letter-spacing:1px}
.ptitle{position:absolute;top:1180px;left:60px;right:60px;text-align:center;font-family:Anton;font-size:124px;line-height:1.02;color:var(--green);text-transform:uppercase}
.pdesc{position:absolute;top:1440px;left:60px;right:60px;text-align:center;font-family:Caveat;font-weight:700;font-size:62px;color:#7a5a32}
.price{position:absolute;left:700px;top:380px;width:330px;height:330px;border-radius:50%;background:var(--gold);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);
  box-shadow:0 16px 0 #a77a28, inset 0 0 0 12px var(--gold), inset 0 0 0 16px rgba(255,248,225,.9)}
.price b{font-family:Anton;font-size:92px;font-weight:400;line-height:1}
.price small{font-weight:800;font-size:30px;letter-spacing:2px}
.extra{position:absolute;left:40px;top:930px;background:var(--terra);color:#fff;border-radius:28px;padding:20px 34px;font-weight:800;font-size:40px;line-height:1.15;
  box-shadow:0 12px 0 #8f4024;text-align:center}
.extra b{display:block;font-family:Anton;font-weight:400;font-size:74px}
.chipa{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fbe2a2 0,#e9b85a 35%,#c98a2f 75%,#9b6420 100%);box-shadow:0 10px 18px rgba(80,50,10,.3)}
.chipa:after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.35),transparent 60%)}

/* ---------- info ---------- */
#info{background:var(--green)}
.card{position:absolute;left:80px;right:80px;height:250px;background:var(--cream);border-radius:40px;display:flex;align-items:center;gap:40px;padding:0 50px;
  box-shadow:0 18px 0 #263026}
.card img{width:150px;height:150px;flex:none}
.card div{font-weight:800;font-size:58px;line-height:1.1;color:var(--green)}
.card small{display:block;font-weight:600;font-size:36px;color:#7a5a32}

/* ---------- cta ---------- */
.btn{display:inline-flex;align-items:center;gap:30px;border-radius:120px;padding:30px 60px;color:#fff;font-weight:800}
.wa{background:#25D366;box-shadow:0 16px 0 #128C4B;font-size:74px}
.ig{background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#833ab4);box-shadow:0 16px 0 #6a2a8a;font-size:66px}
.igicon{width:86px;height:86px;border:9px solid #fff;border-radius:26px;position:relative;flex:none}
.igicon:before{content:"";position:absolute;inset:14px;border:9px solid #fff;border-radius:50%}
.igicon:after{content:"";position:absolute;right:7px;top:7px;width:10px;height:10px;background:#fff;border-radius:50%}

/* ---------- wipe ---------- */
.wipe{position:absolute;left:-200px;top:0;width:1480px;height:3200px;visibility:visible;transform:translateY(1920px);
  animation:wipe .62s linear both;border-radius:50% 50% 0 0/200px 200px 0 0;display:flex;align-items:center;justify-content:center;gap:120px}
.wipe img{width:260px}
</style>
</head>
<body>
<div id="stage">
  <div id="pattern"></div>
  <div id="scenes"></div>
</div>

<script>
const E = n => `assets/emoji/${n}.svg`;
const img = (n, cls='', style='') => `<img class="${cls}" style="${style}" src="${E(n)}">`;

const LOGO_SVG = (size) => `
<svg width="${size}" height="${size}" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lg" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#627361"/><stop offset="1" stop-color="#36423a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1dca0"/><stop offset=".5" stop-color="#b89a55"/><stop offset="1" stop-color="#e8cf8a"/></linearGradient>
    <clipPath id="cc"><circle cx="300" cy="300" r="262"/></clipPath>
  </defs>
  <circle cx="300" cy="300" r="296" fill="#2a332b"/>
  <circle cx="300" cy="300" r="286" fill="url(#lg)"/>
  <circle cx="300" cy="300" r="272" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="300" cy="300" r="258" fill="none" stroke="#e9dcb4" stroke-width="2" opacity=".8"/>
  <g fill="none" stroke="#e7d39b" stroke-width="5">
    <ellipse cx="300" cy="150" rx="78" ry="38"/>
    <ellipse cx="270" cy="150" rx="24" ry="30"/>
    <ellipse cx="300" cy="150" rx="24" ry="32"/>
    <ellipse cx="330" cy="150" rx="24" ry="30"/>
  </g>
  <line x1="200" y1="205" x2="400" y2="205" stroke="#e7d39b" stroke-width="3"/>
  <g clip-path="url(#cc)" stroke="#e9dcb4">
    <line x1="0" y1="232" x2="600" y2="232" stroke-width="3"/>
    <line x1="0" y1="242" x2="600" y2="242" stroke-width="1.5"/>
    <line x1="0" y1="352" x2="600" y2="352" stroke-width="1.5"/>
    <line x1="0" y1="362" x2="600" y2="362" stroke-width="3"/>
  </g>
  <rect x="140" y="345" width="320" height="4" fill="#7fa3b5" opacity=".7"/>
  <text x="300" y="330" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="92" fill="#f3e5bf" letter-spacing="2">DUBRERA</text>
  <circle cx="42" cy="296" r="9" fill="#9dc0cf"/><circle cx="558" cy="296" r="9" fill="#9dc0cf"/>
  <text x="300" y="418" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="29" fill="#f3e5bf" letter-spacing="2">PANADERÍA ARTESANAL</text>
  <path d="M120 480 Q300 560 480 480" fill="none" stroke="#e9dcb4" stroke-width="2" opacity=".6"/>
</svg>`;

// ---------- timeline ----------
const scenes = [];  // {id, start, end, html, cls}
let t = 0;
const add = (dur, html, cls='') => { scenes.push({start:t, end:t+dur, html, cls}); t += dur; };

// 1. HOOK
add(2.7, `
  <div class="rays"></div>
  ${[[60,0],[820,.25],[420,.5],[180,.85],[700,1.05],[900,1.4],[30,1.6],[520,1.9]].map(([x,d],i)=>
     `<img class="faller a" style="left:${x}px;--d:${d}s;width:${130+(i%3)*40}px;opacity:.9" src="${E(i%3==1?'1f35e':'1f950')}">`).join('')}
  <div class="full a" style="animation-name:shake;animation-duration:.5s;--d:.55s">
    <div class="center a" style="top:250px;animation-name:popIn;animation-duration:.5s">
      <div style="display:inline-block;animation:wobble .35s ease-in-out infinite both">${img('1f6a8','','width:230px')}</div>
    </div>
    <div class="center big-alert a" style="top:520px;animation-name:slam;animation-duration:.45s;--d:.12s">ALERTA</div>
    <div class="center big-antojo a" style="top:820px;animation-name:slam;animation-duration:.45s;--d:.5s">DE ANTOJO</div>
    <div class="center a" style="top:1070px;animation-name:popIn;animation-duration:.55s;--d:.95s">
      <div style="display:inline-block;animation:floaty 1s ease-in-out infinite both">${img('1f924','','width:250px')}</div>
    </div>
    <div class="center hand a" style="top:1360px;font-size:84px;color:#f4c95d;animation-name:slideUp;animation-duration:.5s;--d:1.35s">
      lo que sale del horno ${img('1f447','','width:80px;vertical-align:-14px')}</div>
  </div>`, 'hook');

// 2. LOGO REVEAL
add(2.9, `
  ${[[110,330,'2728',.55],[880,360,'2728',.7],[70,880,'1f950',.8],[880,860,'2728',.65],[860,140,'1f35e',.9]].map(([x,y,e,d])=>
    `<div class="spark a" style="left:${x}px;top:${y}px;animation-name:popIn;animation-duration:.5s;--d:${d}s">
       <div style="animation:floaty 1.4s ease-in-out infinite both">${img(e,'','width:110px')}</div></div>`).join('')}
  <div class="logo a" style="left:190px;top:280px;width:700px;height:700px;animation-name:popIn;animation-duration:.8s;--d:.05s">
    ${LOGO_SVG(700)}
    <div class="logo-mask"><i class="a" style="animation-name:shine;animation-duration:.9s;--d:.9s;animation-timing-function:ease-in-out"></i></div>
  </div>
  <div class="center a" style="top:1090px;animation-name:slideR;animation-duration:.6s;--d:.75s"><span class="ribbon">MENÚ DE SEPTIEMBRE</span></div>
  <div class="center hand a" style="top:1300px;font-size:76px;color:#7a5a32;animation-name:slideUp;animation-duration:.5s;--d:1.25s">
    hecho a mano, con masa madre ✦</div>`);

// 3. PRODUCTS
const products = [
  {hero:'1f950', orbs:['2728','1f950'], tag:'x 12 unidades', title:'Medialunas<br>de manteca', desc:'simple · dulce de leche · crema pastelera', price:'$20.000', blob:'#ecc979'},
  {hero:'1f35e', orbs:['1f33f','2728'], tag:'MASA MADRE · 900g', title:'Pan de Campo', desc:'trigo, centeno y espelta orgánicos', price:'$6.500', blob:'#d9c19a'},
  {hero:'1f956', orbs:['1fad2','1fad2'], tag:'MASA MADRE · 900g', title:'Pan de Olivas', desc:'con aceitunas verdes y negras', price:'$7.500', blob:'#b9c49a'},
  {hero:'1fad3', orbs:['1f345','1f33f'], tag:'HARINA ORGÁNICA · 900g', title:'Focaccia<br>Romero & Cherrys', desc:'aceite de oliva y granos de sal', price:'$22.000', blob:'#eba48a'},
  {hero:'1fad3', orbs:['1fad2','1f33f'], tag:'HARINA ORGÁNICA · 900g', title:'Focaccia<br>Olivas Verdes', desc:'aceite de oliva y granos de sal', price:'$22.000', blob:'#b9c49a',
     extra:'¿solo un antojito?<b>PORCIÓN $4.000</b>'},
  {chipa:true, orbs:['1f9c0','2728'], tag:'x 1 KG', title:'Chipá', desc:'parmesano, sardo y cremoso', price:'$18.000', blob:'#ecc979',
     extra:'congelado x 1kg<b>$16.000</b>'},
  {hero:'1f9c0', orbs:['2728','1f9c0'], tag:'160g', title:'Scon de queso', desc:'con queso parmesano', price:'$4.000', blob:'#e6c98c'},
];
const chipaCluster = () => [[120,170,190],[300,140,180],[200,310,200],[30,310,160],[360,320,150]]
  .map(([x,y,s],i)=>`<div class="chipa a" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;animation-name:popIn;animation-duration:.45s;--d:${.1+i*.08}s"></div>`).join('');

products.forEach((p,i)=>{
  add(2.45, `
    <div class="a" style="position:absolute;inset:0;animation-name:popIn;animation-duration:.5s"><div class="blobbg" style="background:${p.blob}"></div></div>
    <div class="plate a" style="animation-name:popIn;animation-duration:.5s;--d:.04s"></div>
    ${p.orbs.map((o,k)=>`<div class="orb a" style="animation-name:fadeIn;animation-duration:.3s;--d:.3s">
        <div class="a" style="animation-name:orbit;animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:linear;--d:${-k*2 - i*.7}s">${img(o)}</div></div>`).join('')}
    <div class="hero a" style="animation-name:popIn;animation-duration:.6s;--d:.1s">
      <div style="width:100%;height:100%;animation:wobble 1.6s ease-in-out infinite both;position:relative">
        ${p.chipa ? chipaCluster() : img(p.hero)}
      </div>
    </div>
    <div class="tag a" style="animation-name:slideUp;animation-duration:.4s;--d:.15s"><span>${p.tag}</span></div>
    <div class="price a" style="animation-name:stamp;animation-duration:.5s;--d:.55s"><small>SOLO</small><b>${p.price}</b></div>
    ${p.extra ? `<div class="extra a" style="animation-name:slideL;animation-duration:.5s;--d:.9s;transform:rotate(-4deg)">${p.extra}</div>` : ''}
    <div class="ptitle a" style="animation-name:slideUp;animation-duration:.45s;--d:.25s">${p.title}</div>
    <div class="pdesc a" style="animation-name:slideUp;animation-duration:.45s;--d:.45s">${p.desc}</div>
    <div class="center a" style="top:1560px;animation-name:fadeIn;animation-duration:.3s;--d:.3s;font-weight:800;font-size:34px;letter-spacing:6px;color:#9a8460">
      ${products.map((_,k)=>`<span style="display:inline-block;width:${k==i?60:18}px;height:18px;border-radius:9px;margin:0 6px;background:${k==i?'#3b473c':'#cdbb93'}"></span>`).join('')}
    </div>`);
});

// 4. INFO
add(3.2, `
  <div class="center a" style="top:250px;font-family:Anton;font-size:140px;color:var(--cream);animation-name:slam;animation-duration:.45s">¿CÓMO PEDÍS?</div>
  <div class="card a" style="top:520px;animation-name:slideL;animation-duration:.55s;--d:.3s">${img('1f4c5')}<div>Pedidos con 48hs<small>de anticipación</small></div></div>
  <div class="card a" style="top:830px;animation-name:slideR;animation-duration:.55s;--d:.6s">${img('1f6f5')}<div>Envíos en CABA<small>te lo llevamos calentito</small></div></div>
  <div class="card a" style="top:1140px;animation-name:slideL;animation-duration:.55s;--d:.9s">${img('1f4cd')}<div>Retiro zona Congreso<small>pasá a buscarlo</small></div></div>`, 'info');

// 5. CTA
add(4.2, `
  <div class="logo a" style="left:340px;top:200px;width:400px;height:400px;animation-name:popIn;animation-duration:.7s">
    <div style="animation:floaty 2s ease-in-out infinite both">${LOGO_SVG(400)}</div></div>
  <div class="center a" style="top:660px;font-family:Anton;font-size:118px;line-height:1.02;color:var(--green);animation-name:slam;animation-duration:.45s;--d:.25s">
    ¿SE TE HIZO<br>AGUA LA BOCA? ${img('1f60b','','width:110px;vertical-align:-8px')}</div>
  <div class="center a" style="top:990px;animation-name:popIn;animation-duration:.5s;--d:.6s">
    <div style="display:inline-block;animation:pulse .8s ease-in-out infinite both">
      <div class="btn wa">
        <svg width="96" height="96" viewBox="0 0 32 32"><path fill="#fff" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.8 2 6.8L3 29l6.6-2c1.9 1 4.1 1.6 6.4 1.6 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.3c-2.1 0-4.1-.6-5.8-1.7l-.4-.3-3.9 1.2 1.2-3.8-.3-.4c-1.2-1.8-1.9-3.9-1.9-6.1C4.9 9.8 9.9 4.9 16 4.9s11.1 4.9 11.1 11-5 10.4-11.1 10.4zm6.1-7.8c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.5c-.3-.7-.6-.6-.7-.6h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.9 1.1 3.4.9 4.1.9.6-.1 2-.8 2.3-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg>
        <span>11 7644-2129</span>
      </div></div></div>
  <div class="center a" style="top:1210px;animation-name:popIn;animation-duration:.5s;--d:.85s">
    <div class="btn ig"><span class="igicon"></span><span>@dubrerapan</span></div></div>
  <div class="center hand a" style="top:1400px;font-size:80px;color:#7a5a32;animation-name:slideUp;animation-duration:.5s;--d:1.2s">
    ¡pedí el tuyo y compartilo! ${img('1f970','','width:76px;vertical-align:-12px')}</div>`);

const TOTAL = t;

// ---------- build DOM ----------
const root = document.getElementById('scenes');
scenes.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'scene';
  if (s.cls) el.id = s.cls;
  el.style.setProperty('--s', s.start + 's');
  el.dataset.start = s.start; el.dataset.end = s.end;
  el.innerHTML = s.html;
  root.appendChild(el);
});
// wipes between scenes (fully covering at the cut)
const wipeColors = ['#d9a441','#3b473c','#c8643b','#d9a441','#3b473c','#c8643b','#d9a441','#3b473c','#c8643b','#d9a441'];
const wipeEmoji = ['1f950','1f35e','1f956','1fad3','2728','1f9c0'];
scenes.slice(1).forEach((s,i)=>{
  const w = document.createElement('div');
  w.className = 'wipe a';
  w.style.background = wipeColors[i % wipeColors.length];
  w.style.setProperty('--s', (s.start - 0.31) + 's');
  w.innerHTML = img(wipeEmoji[i % wipeEmoji.length]) + img(wipeEmoji[(i+2) % wipeEmoji.length]);
  document.getElementById('stage').appendChild(w);
});
// background pattern
document.getElementById('pattern').innerHTML =
  Array.from({length:66},(_,i)=>img(['1f950','1f35e','1f956'][i%3])).join('');

// ---------- seek API ----------
window.TOTAL = TOTAL;
window.seek = (sec) => {
  document.querySelectorAll('.scene').forEach(el=>{
    el.style.visibility = (sec >= +el.dataset.start && sec < +el.dataset.end) ? 'visible' : 'hidden';
  });
  document.getAnimations().forEach(a=>{ a.pause(); a.currentTime = sec*1000; });
};
window.ready = Promise.all([document.fonts.ready,
  ...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]);

// preview mode: play in real time when opened directly
if (!location.hash.includes('render')) {
  const t0 = performance.now();
  const loop = () => { seek(((performance.now()-t0)/1000) % TOTAL); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
